<style>
:root{--bg:#000;--ink:#fff;--soft:#bdbdbd;--grey:#8a8a8a;--dim:#5c5c5c;--line:#262626;--card:#0b0b0b;--ok:#3ec26b;--warn:#f0a42b;--fail:#ef4b4b;--font:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}

.wrap{max-width:1080px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left)) 64px}

.tnote{color:var(--soft);margin:18px 0 0;white-space:pre-line;max-width:70ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--fail)}
section.sec{margin-top:56px}
.side{display:grid;grid-template-columns:200px 1fr;gap:24px}

.rt{display:grid;grid-template-columns:120px 1fr 1.4fr 110px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none}

.rt .d{font-weight:600;white-space:nowrap}
.rt .c{color:var(--soft)}
.rt .f{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--soft);white-space:nowrap}
.rt.off{color:var(--grey)}.rt.off .d{font-weight:400}
.rt .st{color:var(--warn);font-size:12px;margin-left:6px}

.show .meta{color:var(--soft)}

.fit.ok b{color:var(--ok)}.fit.warn b{color:var(--warn)}.fit.fail b{color:var(--fail)}

.pics img{display:block;width:100%;height:auto}
.pics figcaption{font-size:12px;color:var(--grey);margin-top:6px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 20px;margin:22px 0 0;border-top:1px solid var(--line)}

.kv dt{color:var(--grey)}
.kv dd .chk{display:inline-block;margin-left:8px;border:1px solid var(--warn);color:var(--warn);font-size:10px;letter-spacing:.08em;padding:0 6px;border-radius:999px;vertical-align:1px}
.nospec{color:var(--grey);margin-top:18px}
.legal{margin-top:72px;border-top:1px solid var(--line);padding-top:14px;color:var(--grey);font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

.load{color:var(--grey);margin-top:40vh;text-align:center;font-size:13px;letter-spacing:.1em;text-transform:uppercase}

.top.on{display:block}

.s3d .ttl{min-width:0}
.s3d .ttl small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.s3d .ttl b{display:block;font-size:clamp(20px,4vw,34px);line-height:1;letter-spacing:-.03em;text-transform:uppercase;margin-top:6px;overflow-wrap:anywhere}
.s3d .pick{display:flex;align-items:center;gap:6px;flex:none}
.s3d select,.s3d .nav{font:inherit;font-size:13px;color:var(--ink);background:#000a;border:1px solid #ffffff2e;border-radius:999px;padding:8px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.s3d select{max-width:min(46vw,320px);-webkit-appearance:none;appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,#bbb 50%),linear-gradient(135deg,#bbb 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.s3d .nav{width:36px;height:36px;padding:0;cursor:pointer}
/* what to look at: the stage design by itself, or one of the venues */
.s3d .pick{position:relative}
.s3d .chooser{font:inherit;font-size:13px;color:var(--ink);background:#000a;border:1px solid #ffffff2e;border-radius:999px;padding:8px 30px 8px 14px;cursor:pointer;max-width:min(46vw,340px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;position:relative;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.s3d .chooser::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border:solid #bbb;border-width:0 1.5px 1.5px 0;transform:translateY(-70%) rotate(45deg)}
.s3d .chooser:disabled{cursor:default;padding-right:14px}.s3d .chooser:disabled::after{display:none}
.s3d .chooser small{color:var(--grey);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:8px}
.s3d .menu{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:#0a0a0af2;border:1px solid #ffffff2e;border-radius:14px;box-shadow:0 18px 50px #000c;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.s3d .menu[hidden]{display:none}
.s3d .menu .opt{display:flex;align-items:center;gap:10px;width:100%;font:inherit;text-align:left;color:var(--ink);background:none;border:0;border-radius:9px;padding:9px 10px;cursor:pointer}
.s3d .menu .opt:hover,.s3d .menu .opt:focus-visible{background:#ffffff14;outline:none}
.s3d .menu .opt[aria-current=true]{background:#ffffff22}
.s3d .menu .opt b{display:block;font-weight:600;font-size:14px}
.s3d .menu .opt span{display:block;font-size:12px;color:var(--grey)}
.s3d .menu .opt .when{width:74px;flex:none;white-space:nowrap;font-size:12px;color:var(--soft)}
.s3d .menu .opt>div{min-width:0;flex:1}
.s3d .menu .opt>div b,.s3d .menu .opt>div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s3d .menu .lab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);padding:12px 12px 6px}
.s3d .menu .mtop{padding:6px;border-bottom:1px solid #ffffff1a}
.s3d .menu .list{overflow:auto;padding:0 6px 6px}
.s3d .menu input{font:inherit;font-size:13px;width:calc(100% - 12px);margin:0 6px 6px;color:var(--ink);background:#000;border:1px solid #ffffff2e;border-radius:8px;padding:8px 10px}
.s3d .menu .none{color:var(--grey);font-size:13px;padding:10px 12px}
.s3d .menu .ico{width:30px;height:30px;flex:none;border:1px solid #ffffff3a;border-radius:7px;display:grid;place-items:center;color:var(--soft)}
.s3d .fitp{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;color:var(--soft);background:#000a;border:1px solid #ffffff22;border-radius:999px;padding:4px 10px}
.s3d .ft{bottom:0;padding-bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(#0000,#000c)}
.s3d .views{display:flex;gap:4px;padding:4px;border-radius:999px;background:#000b;border:1px solid #ffffff26;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:100%;overflow-x:auto;scrollbar-width:none}
.s3d .views::-webkit-scrollbar{display:none}
.s3d .views button{font:inherit;font-size:13px;color:var(--soft);background:none;border:0;border-radius:999px;padding:8px 13px;white-space:nowrap;cursor:pointer}
.s3d .views button:hover{color:var(--ink)}
.s3d .views button[aria-pressed=true]{background:var(--ink);color:#000}
.s3d .tip{font-size:11px;color:var(--grey);letter-spacing:.04em}
.s3d .tip button{font:inherit;color:var(--soft);background:none;border:0;border-bottom:1px solid #555;padding:0;cursor:pointer}
.s3d .msg3{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--grey);font-size:12px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
.s3d .msg3[hidden]{display:none}
.go3d{font:inherit;font-size:12px;color:var(--soft);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;margin-top:10px}
.go3d:hover{color:var(--ink);border-color:#555}
@media (max-width:560px){.s3d .chooser{flex:1;max-width:none}.s3d .menu{left:0;right:0;width:auto}.s3d .tip span{display:none}.s3d .views button{padding:8px 11px}.s3d .hd{flex-direction:column;align-items:stretch;gap:10px}.s3d .pick{width:100%}.s3d select{flex:1;max-width:none}.s3d .ttl b{font-size:24px}}
.s3d .fitp{white-space:nowrap}
@media (max-width:560px){.s3d .fitp{white-space:normal}}
/* production look and layers, bottom left above the views */
.s3d .lay{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 92px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:min(260px,calc(100% - 32px));pointer-events:auto}
.s3d .lay[hidden]{display:none}
.s3d .seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:#000b;border:1px solid #ffffff26;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.s3d .seg button{font:inherit;font-size:12px;color:var(--soft);background:none;border:0;border-radius:999px;padding:6px 11px;white-space:nowrap;cursor:pointer}
.s3d .seg button[aria-pressed=true]{background:var(--ink);color:#000}
.s3d .lay details{background:#000b;border:1px solid #ffffff26;border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:150px;max-width:100%}
.s3d .lay summary{cursor:pointer;list-style:none;padding:7px 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);display:flex;justify-content:space-between;gap:12px}
.s3d .lay summary::-webkit-details-marker{display:none}
.s3d .lay summary::after{content:"+";color:var(--grey)}
.s3d .lay details[open] summary::after{content:"–"}
.s3d .lay ul{list-style:none;margin:0;padding:0 6px 6px;max-height:min(38vh,300px);overflow:auto}
.s3d .lay li label{display:flex;align-items:center;gap:9px;padding:5px 6px;font-size:13px;color:var(--ink);cursor:pointer;border-radius:8px}
.s3d .lay li label:hover{background:#ffffff12}
.s3d .lay input{accent-color:#fff;margin:0;flex:none}
.s3d .lay i{width:10px;height:10px;border-radius:2px;flex:none;border:1px solid #ffffff40}
.s3d .lay.bw i{background:#fff!important}
.s3d .lay span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* how a drag moves the camera: orbit or pan, bottom right */
.s3d .navm{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 92px);pointer-events:auto}
.s3d .navm[hidden]{display:none}
.s3d .navm button svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px;fill:none;stroke:currentColor;stroke-width:1.6}
@media (max-width:560px){.s3d .navm{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 78px)}.s3d .navm button span{display:none}.s3d .navm button svg{margin:0}}
@media (max-width:560px){.s3d .lay{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 78px)}.s3d .lay ul{max-height:30vh}}
@media print{.s3d{display:none}}
@media print{
  :root{--bg:#fff;--ink:#000;--soft:#333;--grey:#666;--line:#ccc;--card:#fafafa}
  .top,.pics button{cursor:default}.show{break-before:page}details.spec .kv{display:grid}
}
</style>

  </div>
</section>

<script>

  });
  const fitp = el('span', { class: 'fitp' });
  $('s3hd').replaceChildren(
    el('div', { class: 'ttl' }, el('small', { text: 'Venue Access · ' + ((data.tour || {}).artist || 'Tour') }), el('b', { text: (data.tour || {}).name || 'Tour' }), fitp),
    el('div', { class: 'pick' }, shows.length > 1 ? el('button', { class: 'nav', type: 'button', 'aria-label': 'Previous', onclick: () => pick((idx - 1 + shows.length) % shows.length) }, '‹') : null, sel, menu,
      shows.length > 1 ? el('button', { class: 'nav', type: 'button', 'aria-label': 'Next', onclick: () => pick((idx + 1) % shows.length) }, '›') : null));

  async function pick(i, first) {
    const my = ++job; idx = i; cur = shows[i]; sel.disabled = shows.length < 2;
    sel.replaceChildren(el('small', { text: cur.design ? 'Showing' : 'Venue' }), cur.design ? 'Stage design only' : nameOf(cur));
    const f = cur.fit; fitp.hidden = cur.design ? false : !f || !SEVN[f.sev];
    if (cur.design) fitp.replaceChildren(venueIx.length ? 'The production by itself · choose a venue to see it in the room' : 'The stage design');
    else if (f && SEVN[f.sev]) fitp.replaceChildren(el('i', { class: 'dot ' + f.sev }), SEVN[f.sev] + (cur.city ? ' · ' + cur.city : ''));
    $('s3msg').hidden = false; $('s3msg').textContent = 'Loading the stage…';
    try {
      const sc = cur.scene, prod = cur.design ? cur.prod : sc.prod, at = cur.design ? cur.at : sc.at;
      const [v, p] = await Promise.all([cur.design ? genericStage(sc) : load(sc.venue), prod ? load(prod) : null]);
      if (my !== job) return;
      world.clear(); world.add(cur.design ? v : v.clone());
      prodG = null;
      if (p) {
        const layers = prep(p);
        if (prod !== prodUrl) { prodUrl = prod; look.off = new Set([...look.off].filter(L => layers.some(x => x[0] === L))); layPanel(layers); }
        const g = p.clone(); if (at) { g.matrixAutoUpdate = false; g.matrix.fromArray(at); } world.add(g); prodG = g; applyLook();
      } else $('s3lay').hidden = true;
      $('s3msg').hidden = true;
      if (first) { const w = camOf('wide'), f2 = camOf('foh') || w; camera.position.set(w[0][0] * 1.8, w[0][1] * 1.6, w[0][2] * 1.8); controls.target.set(...w[1]); controls.update(); go(f2 === w ? 'wide' : 'foh', 2600); }
      else go(camOf(view) ? view : 'foh', 1200);
    } catch (e) { if (my === job) $('s3msg').textContent = "The 3D view couldn't load. Details are below."; console.info(e); }
  }
  window.__vaShow3d = id => { const i = shows.findIndex(d => d.id === id); if (i < 0) return; scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); pick(i); };
  $('s3down').onclick = () => { $('details').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); };
  addEventListener('keydown', e => {
    if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'checkbox' || e.metaKey || e.ctrlKey || scrollY > host.offsetHeight / 2) return;
    const n = +e.key;
    if (n >= 1 && n <= VIEWS.length) go(VIEWS[n - 1][0]);
    else if (e.key === '0') $('s3views').querySelector('[data-v=orbit]').click();
    else if ((e.key === 'c' || e.key === 'C') && prodG) setLook(look.mode === 'bw' ? 'col' : 'bw');
    else if (e.key === 'p' || e.key === 'P') setNav('pan');
    else if (e.key === 'o' || e.key === 'O') setNav('orbit');
    else if (e.key === 'ArrowRight' && shows.length > 1) pick((idx + 1) % shows.length);
    else if (e.key === 'ArrowLeft' && shows.length > 1) pick((idx - 1 + shows.length) % shows.length);
  });

  // draw only while the stage is on screen
  let onScreen = true;
  new IntersectionObserver(es => { onScreen = es[0].isIntersecting; }).observe(host);
  renderer.setAnimationLoop(now => {
    if (!onScreen) return;
    if (fly) {
      const k = Math.min(1, (now - fly.s) / fly.ms), t = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(fly.p0, fly.p1, t); controls.target.lerpVectors(fly.t0, fly.t1, t);
      if (k >= 1) fly = null;
    }
    controls.update(); renderer.render(scene, camera);
  });
  window.__va3d = { pick: i => pick(i), go, state: () => {
    const pr = { meshes: 0, shown: 0, white: 0, edges: 0, cols: new Set() };
    if (prodG) prodG.traverse(o => { if (o.userData.edge) { if (o.visible && o.parent.visible) pr.edges++; } else if (o.isMesh) { pr.meshes++; if (o.visible) { pr.shown++; if (o.material === WHITE) pr.white++; else pr.cols.add(o.material.color.getHexString()); } } });
    return { show: cur && cur.id, view, flying: !!fly, objects: world.children.length, cam: camera.position.toArray().map(v => +v.toFixed(2)), mode: look.mode, off: [...look.off], nav, target: controls.target.toArray().map(v => +v.toFixed(2)), prod: { ...pr, cols: [...pr.cols] } };
  } };
  pick(0, true);
}
if (window.__vaShareData) start(window.__vaShareData); else addEventListener('va-share-ready', e => start(e.detail), { once: true });
</script>
